<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgLiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardElevation" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .li-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 800; font-size: 28px; fill: #0F172A; }
    .li-sub { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 500; font-size: 15px; fill: #475569; }
    .card-title { font-family: 'Segoe UI', sans-serif; font-weight: 700; font-size: 16px; fill: #0F172A; }
    .card-desc { font-family: 'Segoe UI', sans-serif; font-size: 13px; fill: #475569; line-height: 1.5; }
    .metric-big { font-family: 'Segoe UI', sans-serif; font-weight: 800; font-size: 23px; }
    .metric-label { font-family: 'Segoe UI', sans-serif; font-weight: 600; font-size: 11px; text-transform: uppercase; fill: #64748B; }
    .tag-badge { font-family: 'Segoe UI', sans-serif; font-weight: 700; font-size: 11px; fill: #047857; }
  </style>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgLiGrad)"/>
  
  <!-- Outer Card Frame -->
  <rect x="25" y="20" width="1150" height="635" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardElevation)"/>

  <!-- Header Row -->
  <g transform="translate(60, 45)">
    <!-- Brand Icon -->
    <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#primaryGrad)"/>
    <path d="M24 11 L14 27 L23 27 L21 39 L33 23 L24 23 Z" fill="#FFFFFF"/>
    
    <text x="62" y="27" class="li-title">DealForge AI — Project Launch</text>
    <text x="62" y="46" class="li-sub">AI Proposal Risk Scanner &amp; Margin Protection Copilot for Digital Agencies</text>

    <!-- Top Status Badge -->
    <rect x="850" y="8" width="180" height="32" rx="16" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <circle cx="868" cy="24" r="5" fill="#10B981"/>
    <text x="882" y="28" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#047857">PRODUCTION READY</text>
  </g>

  <line x1="60" y1="115" x2="1115" y2="115" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Content 3-Column Grid -->
  
  <!-- Column 1: The Problem & Evidence -->
  <g transform="translate(60, 135)">
    <rect width="330" height="340" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
    <rect x="20" y="20" width="160" height="26" rx="6" fill="#FEE2E2"/>
    <text x="30" y="38" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#DC2626">🚨 THE PAIN POINT</text>
    <text x="20" y="75" class="card-title">Fixed-Fee Margin Bleed</text>
    <text x="20" y="105" class="card-desc">
      <tspan x="20" dy="0">• 68% of agencies experience severe</tspan>
      <tspan x="20" dy="21">  scope creep on fixed-fee builds.</tspan>
      <tspan x="20" dy="21">• $35,000 average annual write-offs</tspan>
      <tspan x="20" dy="21">  in unbilled rework hours.</tspan>
      <tspan x="20" dy="21">• 47-day delayed milestone invoices</tspan>
      <tspan x="20" dy="21">  from subjective approval traps.</tspan>
      <tspan x="20" dy="21">• Slow, expensive outside legal fees.</tspan>
    </text>

    <rect x="20" y="245" width="290" height="70" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1"/>
    <text x="35" y="271" class="metric-label" fill="#B91C1C">Average Margin Loss per Bad Deal</text>
    <text x="35" y="298" class="metric-big" fill="#EF4444">$22,000 – $45,000</text>
  </g>

  <!-- Column 2: The Solution Engine -->
  <g transform="translate(425, 135)">
    <rect width="330" height="340" rx="12" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
    <rect x="20" y="20" width="160" height="26" rx="6" fill="#DCFCE7"/>
    <text x="30" y="38" class="tag-badge">🛡️ THE CORE SOLUTION</text>
    <text x="20" y="75" class="card-title">60-Second Risk Scanner</text>
    <text x="20" y="105" class="card-desc">
      <tspan x="20" dy="0">• 50-point heuristic &amp; semantic</tspan>
      <tspan x="20" dy="21">  clause risk analyzer.</tspan>
      <tspan x="20" dy="21">• Real-time Dollar-at-Risk margin</tspan>
      <tspan x="20" dy="21">  exposure calculation model.</tspan>
      <tspan x="20" dy="21">• Instant one-click drop-in deemed</tspan>
      <tspan x="20" dy="21">  acceptance amendments.</tspan>
      <tspan x="20" dy="21">• Zero-retention local PII scrubber.</tspan>
    </text>

    <rect x="20" y="245" width="290" height="70" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
    <text x="35" y="271" class="metric-label" fill="#047857">Audit Speed &amp; Accuracy</text>
    <text x="35" y="298" class="metric-big" fill="#10B981">&lt; 2.0s (100% Pass)</text>
  </g>

  <!-- Column 3: The Architecture & Economics -->
  <g transform="translate(790, 135)">
    <rect width="330" height="340" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="20" y="20" width="180" height="26" rx="6" fill="#E2E8F0"/>
    <text x="30" y="38" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#334155">📊 UNIT ECONOMICS</text>
    <text x="20" y="75" class="card-title">High-Margin SaaS Model</text>
    <text x="20" y="105" class="card-desc">
      <tspan x="20" dy="0">• Starter: Free (2 audits / month)</tspan>
      <tspan x="20" dy="21">• Agency Pro: $79 / month ($790/yr)</tspan>
      <tspan x="20" dy="21">• Founder Lifetime: $499 (50 seats)</tspan>
      <tspan x="20" dy="21">• Blended Gross Margin: 86.4%</tspan>
      <tspan x="20" dy="21">• LTV-to-CAC Ratio: 12.6x ($2,330 LTV)</tspan>
      <tspan x="20" dy="21">• Payback Period: 1.9 Months</tspan>
    </text>

    <rect x="20" y="245" width="290" height="70" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <text x="35" y="271" class="metric-label">Automated Test Suites</text>
    <text x="35" y="298" class="metric-big" fill="#0F172A">15 of 15 Tests Passing ✓</text>
  </g>

  <!-- Bottom CTA Footer Bar -->
  <g transform="translate(60, 500)">
    <rect width="1060" height="120" rx="14" fill="#0F172A"/>
    <text x="35" y="45" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF">
      Built &amp; Validated with the CO-STAR Startup Builder Engine
    </text>
    <text x="35" y="72" font-family="'Segoe UI', sans-serif" font-weight="400" font-size="14" fill="#94A3B8">
      Explore live code, Lean Canvas, financial model, and automated test suites on GitHub:
    </text>
    <text x="35" y="96" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" fill="#10B981">
      github.com/vijaymahes9080/Datheon_AI_Startup_-_SaaS_Launch_Lab
    </text>

    <!-- Star / GitHub Badge Right -->
    <rect x="880" y="38" width="145" height="42" rx="21" fill="#10B981"/>
    <text x="912" y="64" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="14" fill="#0F172A">View Repo →</text>
  </g>
</svg>
