<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <defs>
    <linearGradient id="bgPreview" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow3" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .title-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 800; font-size: 22px; fill: #0F172A; }
    .meta-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; fill: #64748B; }
    .badge-danger { font-family: 'Segoe UI', sans-serif; font-weight: 700; font-size: 13px; fill: #DC2626; }
    .badge-safe { font-family: 'Segoe UI', sans-serif; font-weight: 700; font-size: 13px; fill: #059669; }
    .body-code { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; fill: #334155; line-height: 1.6; }
    .highlight-red { fill: #991B1B; font-weight: 700; }
    .highlight-green { fill: #065F46; font-weight: 700; }
    .note-text { font-family: 'Segoe UI', sans-serif; font-size: 12px; font-weight: 500; }
  </style>

  <!-- Background -->
  <rect width="1200" height="520" fill="url(#bgPreview)"/>
  <rect x="30" y="20" width="1140" height="480" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow3)"/>

  <!-- Window Header -->
  <rect x="30" y="20" width="1140" height="56" rx="16" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="30" y="55" width="1140" height="21" fill="#F1F5F9"/>
  <line x1="30" y1="76" x2="1170" y2="76" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Window Control Dots -->
  <circle cx="60" cy="48" r="6" fill="#EF4444"/>
  <circle cx="80" cy="48" r="6" fill="#F59E0B"/>
  <circle cx="100" cy="48" r="6" fill="#10B981"/>

  <text x="130" y="52" class="meta-text">audit_sample_sow_v2.docx (Execution Time: 1.2s)</text>

  <!-- Risk Score & Margin Bleed Badges -->
  <rect x="830" y="34" width="170" height="28" rx="14" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="844" y="53" class="badge-danger">Risk Score: 78/100</text>

  <rect x="1015" y="34" width="135" height="28" rx="14" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
  <text x="1027" y="53" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#D97706">Bleed: $28,500</text>

  <!-- LEFT CARD: Dangerous Clause -->
  <g transform="translate(60, 105)">
    <rect width="520" height="360" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
    <rect x="20" y="20" width="280" height="28" rx="6" fill="#FEE2E2" stroke="#F87171" stroke-width="1"/>
    <text x="32" y="39" class="badge-danger">❌ FLAGGED CLAUSE (MARGIN BLEED)</text>

    <!-- Clause Text Content -->
    <text x="20" y="80" class="body-code">
      <tspan x="20" dy="0">"The Agency shall deliver the mobile portal</tspan>
      <tspan x="20" dy="22">within 90 days. Final payment of $25,000</tspan>
      <tspan x="20" dy="22">shall be issued upon </tspan>
      <tspan class="highlight-red">Client's complete</tspan>
      <tspan x="20" dy="22" class="highlight-red">satisfaction and unrestricted approval</tspan>
      <tspan x="20" dy="22">of all functionality, including </tspan>
      <tspan class="highlight-red">any</tspan>
      <tspan x="20" dy="22" class="highlight-red">modifications deemed reasonable</tspan>
      <tspan> by</tspan>
      <tspan x="20" dy="22">the steering committee."</tspan>
    </text>

    <!-- Impact Box with wrapped lines -->
    <rect x="20" y="250" width="480" height="85" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1"/>
    <text x="35" y="274" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#B91C1C">⚠️ Calculated Exposure &amp; Delay Analysis:</text>
    <text x="35" y="296" class="note-text" fill="#7F1D1D">
      <tspan x="35" dy="0">Subjective approval criteria creates an estimated 47-day final</tspan>
      <tspan x="35" dy="18">invoice payment freeze and 180+ hours of unbilled rework write-offs.</tspan>
    </text>
  </g>

  <!-- RIGHT CARD: DealForge Protective Amendment -->
  <g transform="translate(620, 105)">
    <rect width="520" height="360" rx="12" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
    <rect x="20" y="20" width="310" height="28" rx="6" fill="#DCFCE7" stroke="#4ADE80" stroke-width="1"/>
    <text x="32" y="39" class="badge-safe">✅ DEALFORGE DROP-IN AMENDMENT</text>

    <!-- Clause Text Content -->
    <text x="20" y="80" class="body-code">
      <tspan x="20" dy="0">"Final payment of $25,000 shall become due</tspan>
      <tspan x="20" dy="22">upon delivery against the mutually agreed</tspan>
      <tspan x="20" dy="22">Feature Matrix (Exhibit A). </tspan>
      <tspan class="highlight-green">Client shall</tspan>
      <tspan x="20" dy="22" class="highlight-green">have five (5) business days to submit</tspan>
      <tspan x="20" dy="22" class="highlight-green">written itemized defects.</tspan>
      <tspan> In absence of</tspan>
      <tspan x="20" dy="22">written notice, </tspan>
      <tspan class="highlight-green">deliverables are deemed</tspan>
      <tspan x="20" dy="22" class="highlight-green">accepted and payable within 10 days."</tspan>
    </text>

    <!-- Protection Box with wrapped lines -->
    <rect x="20" y="250" width="480" height="85" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
    <text x="35" y="274" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#047857">🛡️ Mathematical Margin Protection:</text>
    <text x="35" y="296" class="note-text" fill="#065F46">
      <tspan x="35" dy="0">Objective 5-day deemed acceptance clause eliminates unbudgeted</tspan>
      <tspan x="35" dy="18">revision loops and guarantees contractual milestone release.</tspan>
    </text>
  </g>
</svg>
